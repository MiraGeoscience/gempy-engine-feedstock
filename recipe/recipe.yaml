schema_version: 1

context:
  name: gempy-engine
  version: "2026.1.0a1"

package:
  name: gempy-engine
  version: "${{ version }}"

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/gempy_engine-${{ version }}.tar.gz
  sha256: 5ab0450e9378dbe2f3e457ddc5105d824bd72ac77e09cb702f878f163cd5c702

build:
  number: 0
  noarch: python
  script:
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: "${{ version }}"
    content:
      ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >=${{ python_min }}
    - numpy
    - pydantic
    - python-dotenv
    - scipy

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - gempy_engine
      pip_check: true

about:
  summary: A Python package necessary for GemPy.
  description: A Python package necessary for GemPy.
  license: EUPL-1.2
  license_file: LICENSE
  homepage: https://github.com/gempy-project/gempy_engine
  repository: https://github.com/gempy-project/gempy_engine

extra:
  recipe-maintainers:
    - conda-forge/geoh5py
    - conda-forge/gempy
